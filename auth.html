<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Glassico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* No announcement bar / navbar on auth page */
    .announcement-bar,
    .navbar { display: none !important; }
    body { background: var(--surface); }
  </style>
</head>
<body>

  <div class="auth-page">

    <!-- ── LEFT: Form ─────────────────────────── -->
    <div class="auth-page__left">

      <!-- Back to site link -->
      <a href="index.html" style="position:absolute;top:28px;left:32px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;transition:color 0.2s;">
        ← Glassico
      </a>


      <div class="auth-card">

        <div class="auth-card__heading">Welcome Back</div>
        <div class="auth-card__sub">Sign in to your Glassico account.</div>

        <!-- Tabs -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" data-tab="login" role="tab" aria-selected="true">LOGIN</button>
          <button class="auth-tab"        data-tab="signup" role="tab" aria-selected="false">SIGN UP</button>
        </div>

        <!-- ── LOGIN PANEL ── -->
        <div class="auth-panel active" id="panel-login" role="tabpanel">

          <p class="field-error" id="login-global-error" style="font-size:14px;margin-bottom:12px;"></p>

          <form id="login-form" novalidate>

            <div class="form-group">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
              <span class="field-error" id="login-email-error"></span>
            </div>

            <div class="form-group">
              <label for="login-password" style="display:flex;justify-content:space-between;">
                Password
                <a href="#" class="auth-forgot">FORGOT PASSWORD?</a>
              </label>
              <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
              <span class="field-error" id="login-password-error"></span>
            </div>

            <button type="submit" class="btn-dark btn-full" style="margin-top:8px;">
              ENTER THE GALLERY
            </button>

          </form>

          <div class="auth-divider">OR</div>

          <div class="auth-social">
            <button class="auth-social-btn" type="button" aria-label="Continue with Google">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.64 9.2c0-.638-.057-1.252-.164-1.84H9v3.48h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
              </svg>
              Google
            </button>
            <button class="auth-social-btn" type="button" aria-label="Continue with Apple">
              <svg width="18" height="18" viewBox="0 0 814 1000" fill="#000" xmlns="http://www.w3.org/2000/svg">
                <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 612 0 510.4 0 413.8c0-156.3 102.1-238.7 202.8-238.7 65.5 0 120.2 43.4 160.6 43.4 39 0 99.9-45.8 173.6-45.8 27.5 0 127.7 2.4 190.8 82.4zM605.4 64.6c28.3-37.7 49.1-89.5 49.1-141.3 0-7.8-.6-15.7-1.9-22.4-46 1.9-101.7 32.4-137.6 75-27.3 32.4-52.3 84.2-52.3 136.6 0 8.4 1.3 16.8 1.9 19.3 3.2.6 8.4 1.3 13.6 1.3 41 0 90.1-28.9 127.2-68.5z"/>
              </svg>
              Apple
            </button>
          </div>

          <p class="auth-terms">
            By signing in you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
          </p>

        </div>

        <!-- ── SIGN UP PANEL ── -->
        <div class="auth-panel" id="panel-signup" role="tabpanel">

          <p class="field-error" id="signup-global-error" style="font-size:14px;margin-bottom:12px;"></p>

          <form id="signup-form" novalidate>

            <div class="form-row">
              <div class="form-group">
                <label for="signup-first">First Name</label>
                <input type="text" id="signup-first" placeholder="First" autocomplete="given-name">
                <span class="field-error" id="signup-first-error"></span>
              </div>
              <div class="form-group">
                <label for="signup-last">Last Name</label>
                <input type="text" id="signup-last" placeholder="Last" autocomplete="family-name">
                <span class="field-error" id="signup-last-error"></span>
              </div>
            </div>

            <div class="form-group">
              <label for="signup-email">Email</label>
              <input type="email" id="signup-email" placeholder="your@email.com" autocomplete="email">
              <span class="field-error" id="signup-email-error"></span>
            </div>

            <div class="form-group">
              <label for="signup-password">Password</label>
              <input type="password" id="signup-password" placeholder="Min. 8 characters" autocomplete="new-password">
              <span class="field-error" id="signup-password-error"></span>
            </div>

            <div class="form-group">
              <label for="signup-confirm">Confirm Password</label>
              <input type="password" id="signup-confirm" placeholder="Repeat password" autocomplete="new-password">
              <span class="field-error" id="signup-confirm-error"></span>
            </div>

            <button type="submit" class="btn-dark btn-full" style="margin-top:8px;">
              CREATE ACCOUNT
            </button>

          </form>

          <p class="auth-terms">
            By creating an account you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
          </p>

        </div>

      </div>
    </div>

    <!-- ── RIGHT: Dark panel ───────────────────── -->
    <div class="auth-page__right" aria-hidden="true">
      <img class="auth-page__right-img" src="images/placeholder.svg" alt="" role="presentation">
      <div style="position:absolute;bottom:48px;left:0;right:0;text-align:center;padding:0 40px;">
        <p style="font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(18px,2vw,26px);color:rgba(255,255,255,0.6);line-height:1.5;">
          "The right frame is not<br>accessory — it is identity."
        </p>
        <p style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:12px;letter-spacing:0.1em;text-transform:uppercase;">The Glassico Edit</p>
      </div>
    </div>

  </div>

  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
