<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Glassico</title>
  <meta name="description" content="View product details and add to your bag.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>


  <!-- Breadcrumb -->
  <div style="background:var(--surface);border-bottom:1px solid var(--border);padding:14px 0;">
    <div class="container">
      <nav class="cart-breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a> /
        <a href="shop.html">Shop</a> /
        <span id="breadcrumb-name" style="color:var(--dark);">Loading…</span>
      </nav>
    </div>
  </div>

  <!-- PRODUCT DETAIL-->
  <div class="container" id="product-detail-container">
    <div class="product-detail">


      <div class="product-detail__gallery">
        <div class="gallery__main">
          <img id="gallery-main-img" src="images/placeholder.svg" alt="Product" width="600" height="600">
        </div>




      </div>


      <div class="product-detail__info">

        <div class="product-detail__badge" id="product-badge"></div>

        <h1 class="product-detail__name" id="product-name">Loading…</h1>
        <div class="product-detail__subtitle" id="product-subtitle"></div>
        <div class="product-detail__price" id="product-price"></div>

        <div id="product-stock" style="margin-bottom:20px;"></div>

        <p class="product-detail__desc" id="product-desc"></p>

        <div class="product-detail__actions">
          <button class="btn-gold btn-full" id="btn-add-to-cart" style="flex:1;">ADD TO CART</button>

        </div>

        <!-- Specs table -->
        <table class="specs-table">
          <tbody>
            <tr>
              <td>Brand</td>
              <td id="spec-brand">—</td>
            </tr>
            <tr>
              <td>Measurements</td>
              <td id="spec-measurements">—</td>
            </tr>
            <tr>
              <td>Material</td>
              <td id="spec-material">—</td>
            </tr>
            <tr>
              <td>Color</td>
              <td id="spec-color">—</td>
            </tr>
            <tr>
              <td>Gender</td>
              <td id="spec-gender">—</td>
            </tr>
            <tr>
              <td>SKU</td>
              <td id="spec-sku">—</td>
            </tr>
          </tbody>
        </table>

      </div>

    </div>
  </div>


  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/product.js"></script>
  <script>
    // Sync breadcrumb
    const nameEl = document.getElementById('product-name');
    const observer = new MutationObserver(() => {
      const breadcrumb = document.getElementById('breadcrumb-name');
      if (breadcrumb && nameEl.textContent && nameEl.textContent !== 'Loading…') {
        breadcrumb.textContent = nameEl.textContent;
        observer.disconnect();
      }
    });
    if (nameEl) observer.observe(nameEl, { childList: true, characterData: true, subtree: true });


  </script>
</body>
</html>
