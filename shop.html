<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Glassico Eyewear</title>
  <meta name="description" content="Browse the full Glassico collection. Filter by brand, shape, gender and price.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- main.js injects announcement bar + navbar -->

  <!-- ═══════════════════════════════════════
       PAGE HEADER
  ═══════════════════════════════════════ -->
  <div style="background:var(--surface);border-bottom:1px solid var(--border);padding:32px 0;">
    <div class="container">
      <p class="caps text-gold" style="margin-bottom:6px;">The Collection</p>
      <h1 style="font-size:clamp(28px,3.5vw,40px);">All Eyewear</h1>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       SHOP LAYOUT
  ═══════════════════════════════════════ -->
  <div class="container">
    <div class="shop-layout">

      <!-- ── SIDEBAR ────────────────────────── -->
      <aside class="shop-sidebar">

        <div class="sidebar-section">
          <div class="sidebar-section__title">Gender</div>
          <label class="sidebar-check"><input type="checkbox" data-filter="gender" value="men"> Men</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="gender" value="women"> Women</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="gender" value="kids"> Kids</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="gender" value="unisex"> Unisex</label>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section__title">Brand</div>
          <label class="sidebar-check"><input type="checkbox" data-filter="brand" value="Oliver Peoples"> Oliver Peoples</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="brand" value="Tom Ford"> Tom Ford</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="brand" value="Persol"> Persol</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="brand" value="Moscot"> Moscot</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="brand" value="Garrett Leight"> Garrett Leight</label>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section__title">Frame Shape</div>
          <label class="sidebar-check"><input type="checkbox" data-filter="shape" value="round"> Round</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="shape" value="square"> Square</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="shape" value="aviator"> Aviator</label>
          <label class="sidebar-check"><input type="checkbox" data-filter="shape" value="cat_eye"> Cat Eye</label>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section__title">Color</div>
          <div class="color-swatches" id="color-swatches">
            <!-- Populated by shop.js -->
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section__title">Price Range</div>
          <div class="price-slider-wrap">
            <div class="price-range-display">
              <span id="price-min-display">$100</span>
              <span id="price-max-display">$1000</span>
            </div>
            <div class="dual-range">
              <div class="dual-range__track"></div>
              <div class="dual-range__fill" id="price-fill" style="left:0%;width:100%;"></div>
              <input type="range" id="price-min" min="100" max="1000" value="100" step="10" aria-label="Minimum price">
              <input type="range" id="price-max" min="100" max="1000" value="1000" step="10" aria-label="Maximum price">
            </div>
          </div>
        </div>

      </aside>

      <!-- ── MAIN GRID ───────────────────────── -->
      <main>

        <!-- Active filter pills -->
        <div class="filter-pills" id="filter-pills"></div>

        <!-- Sort + count row -->
        <div class="shop-main__header">
          <div style="display:flex;align-items:center;gap:12px;">
            <!-- Mobile filter toggle (optional) -->
            <span class="shop-main__count" id="product-count">Loading…</span>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <label for="sort-select" class="caps" style="white-space:nowrap;">Sort by</label>
            <select id="sort-select" class="sort-select" aria-label="Sort products">
              <option value="featured">Featured</option>
              <option value="price_asc">Price: Low → High</option>
              <option value="price_desc">Price: High → Low</option>
              <option value="newest">Newest First</option>
            </select>
          </div>
        </div>

        <!-- Product grid -->
        <div class="products-grid" id="products-grid">
          <!-- Populated by shop.js -->
        </div>

        <!-- Load more -->
        <div class="load-more-wrap">
          <button id="load-more-btn" class="btn-outline" style="display:none;">LOAD MORE</button>
        </div>

      </main>

    </div>
  </div>

  <!-- main.js injects footer -->

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
